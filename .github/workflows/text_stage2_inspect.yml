name: Text Stage 2 Source Inspect

on:
  pull_request:
    paths:
      - 'data_processing/text/.stage2_inspect_trigger'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Print source structure
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, json
          p=Path('data_processing/text/Though I Am an Inept Villainess Tale of the Butterfly-Rat Body Swap in the Maiden Court/惡女不才_volume1.md')
          raw=p.read_bytes()
          text=raw.decode('utf-8-sig')
          lines=text.splitlines()
          print('TOTAL_LINES', len(lines))
          print('SHA256', hashlib.sha256(raw).hexdigest())
          for i,line in enumerate(lines,1):
              if line.startswith('#'):
                  print('HEADING', i, json.dumps(line, ensure_ascii=False))
          PY
