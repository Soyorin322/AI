name: Build Volume 1 Stage 2 Events

on:
  pull_request:
    paths:
      - 'data_processing/text/.stage2_volume1_build_trigger'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Generate conservative Stage 2 events.json
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, json, re

          SOURCE = Path('data_processing/text/Though I Am an Inept Villainess Tale of the Butterfly-Rat Body Swap in the Maiden Court/惡女不才_volume1.md')
          TARGET = Path('data_processing/text/Though I Am an Inept Villainess Tale of the Butterfly-Rat Body Swap in the Maiden Court/processed/volume_01/events.json')
          EXPECTED_SHA256 = '83d62b0eb687f48bc29fa84b74ed6d8aec8b34aa1fadb754e5642b0f582aed5b'

          raw = SOURCE.read_bytes()
          sha = hashlib.sha256(raw).hexdigest()
          if sha != EXPECTED_SHA256:
              raise SystemExit(f'FATAL: source SHA changed: {sha}')
          lines = raw.decode('utf-8-sig').splitlines()
          if len(lines) != 3682:
              raise SystemExit(f'FATAL: source line count changed: {len(lines)}')

          # Event definitions are story-level indexes. `label` is navigation-only and never evidence.
          # `witnesses` controls who receives spoken lines from this event. Thoughts remain private.
          defs = [
            ('序章',32,79,'乞巧節雛宮集會與玲琳在眾人眼中的地位',
             ['玲琳','慧月','堯明','辰宇','清佳','芳春','歌吹','絹秀'],
             ['玲琳','慧月','堯明','辰宇','清佳','芳春','歌吹','絹秀','女官們'],'玲琳','main_story'),
            ('序章',80,104,'彗星與流星出現後玲琳墜樓，慧月被拘捕',
             ['玲琳','慧月','堯明'],
             ['玲琳','慧月','堯明','辰宇','清佳','芳春','歌吹','絹秀','女官們'],'玲琳','main_story'),
            ('序章',105,136,'玲琳在朱慧月身體中於牢房醒來',
             ['玲琳','冬雪'],['玲琳','冬雪'],'玲琳','main_story'),
            ('第一章',137,190,'玲琳確認換身並發現無法說明自身身份，冬雪拒絕相信',
             ['玲琳','冬雪'],['玲琳','冬雪'],'玲琳','main_story'),
            ('第一章',191,262,'慧月透過炎像之術聯絡玲琳並說明換身與報復意圖',
             ['玲琳','慧月'],['玲琳','慧月'],'玲琳','main_story'),
            ('第二章',263,330,'獸尋之儀開始，堯明公開指控並要求朱慧月受審',
             ['玲琳','堯明','辰宇','慧月','絹秀','雅媚','清佳','芳春','歌吹'],
             ['玲琳','堯明','辰宇','慧月','絹秀','雅媚','清佳','芳春','歌吹','雛宮眾人'],'辰宇','main_story'),
            ('第二章',331,399,'玲琳在獸尋之儀中面對獅子並存活',
             ['玲琳','辰宇','堯明','慧月'],
             ['玲琳','辰宇','堯明','慧月','絹秀','雅媚','清佳','芳春','歌吹','雛宮眾人'],'玲琳','main_story'),
            ('第二章',400,464,'辰宇依儀式判定朱慧月無罪，堯明接受結果但警告她',
             ['玲琳','辰宇','堯明','慧月'],
             ['玲琳','辰宇','堯明','慧月','絹秀','雅媚','清佳','芳春','歌吹','雛宮眾人'],'辰宇','main_story'),
            ('第三章',465,585,'莉莉奉命將玲琳帶到朱駒宮廢棄倉庫居住',
             ['玲琳','莉莉'],['玲琳','莉莉'],'玲琳','main_story'),
            ('第三章',586,696,'辰宇與文昴巡查朱駒宮並看到玲琳親自整理梨園',
             ['玲琳','辰宇','文昴'],['玲琳','辰宇','文昴'],'辰宇','main_story'),
            ('第三章',697,759,'莉莉被朱駒宮拒絕供食並在雛宮附近遇到雅容',
             ['莉莉','尚食長','雅容'],['莉莉','尚食長','雅容'],'莉莉','main_story'),
            ('第三章',760,797,'雅容以食物與白鼠衣為條件要求莉莉欺壓朱慧月',
             ['莉莉','雅容'],['莉莉','雅容'],'莉莉','main_story'),
            ('第三章',798,853,'莉莉回到倉庫，發現玲琳已將荒地整理成可生活的環境',
             ['玲琳','莉莉'],['玲琳','莉莉'],'莉莉','main_story'),
            ('第四章',854,939,'慧月在黃玲琳身體中享受受人照顧的環境並回顧自身處境',
             ['慧月'],['慧月'],'慧月','main_story'),
            ('第四章',940,987,'冬雪要求病中的「玲琳」照常鍛煉，慧月首次理解玲琳日常強度',
             ['慧月','冬雪'],['慧月','冬雪','黃家女官們'],'慧月','main_story'),
            ('第五章',988,1179,'玲琳在倉庫生活並與持續嘗試欺負她的莉莉逐漸形成互動',
             ['玲琳','莉莉'],['玲琳','莉莉'],'玲琳','main_story'),
            ('第五章',1180,1231,'雅容升高對莉莉的要求，交付短刀並以發簪竊盜罪威脅她',
             ['莉莉','雅容'],['莉莉','雅容'],'莉莉','main_story'),
            ('第五章',1232,1380,'堯明與辰宇談論「朱慧月」的變化，文昴報告莉莉持刀前往倉庫',
             ['堯明','辰宇','文昴'],['堯明','辰宇','文昴'],'辰宇','main_story'),
            ('第五章',1381,1510,'莉莉持刀與玲琳衝突，辰宇與文昴介入，玲琳庇護莉莉',
             ['玲琳','莉莉','辰宇','文昴'],['玲琳','莉莉','辰宇','文昴'],'玲琳','main_story'),
            ('第五章',1511,1619,'玲琳安撫莉莉並賜予銀硃衣，莉莉道歉並決定不再背叛她',
             ['玲琳','莉莉'],['玲琳','莉莉'],'莉莉','main_story'),
            ('第六章',1620,1685,'慧月在黃玲琳身體中因高燒與呼吸困難陷入恐慌',
             ['慧月'],['慧月'],'慧月','main_story'),
            ('第六章',1686,1760,'慧月透過炎像之術求助，玲琳指導她呼吸並使用藥物',
             ['玲琳','慧月'],['玲琳','慧月'],'玲琳','main_story'),
            ('第六章',1761,1887,'玲琳提議解除換身並表達感謝，慧月拒絕並重申要讓玲琳體驗自身境遇',
             ['玲琳','慧月'],['玲琳','慧月'],'慧月','main_story'),
            ('第七章',1888,2037,'玲琳修補莉莉的銀硃衣並制定訓練計畫，請莉莉教授胡旋舞',
             ['玲琳','莉莉'],['玲琳','莉莉'],'莉莉','main_story'),
            ('第七章',2038,2090,'辰宇向堯明表示「朱慧月」似乎改變，堯明說明自己仍無法善待她',
             ['堯明','辰宇'],['堯明','辰宇'],'辰宇','main_story'),
            ('第八章',2091,2250,'清佳主持中元節並安排對舞藝不佳者潑水，期待朱慧月出醜',
             ['清佳','堯明','辰宇','歌吹','芳春','玲琳','莉莉'],
             ['清佳','堯明','辰宇','歌吹','芳春','玲琳','莉莉','絹秀','雅媚','雛宮眾人'],'清佳','main_story'),
            ('第八章',2251,2399,'奉納之舞開始，玲琳將雅容交給莉莉的發簪作為賞賜交回清佳',
             ['玲琳','莉莉','清佳','歌吹','芳春','堯明','辰宇'],
             ['玲琳','莉莉','清佳','歌吹','芳春','堯明','辰宇','絹秀','雅媚','雛宮眾人'],'清佳','main_story'),
            ('第八章',2400,2449,'金家女官破壞錫杖，清佳否認授意並斥責該行為',
             ['玲琳','清佳','辰宇','金家女官'],
             ['玲琳','莉莉','清佳','辰宇','堯明','絹秀','雅媚','雛宮眾人'],'清佳','main_story'),
            ('第八章',2450,2549,'玲琳改跳胡旋舞並獲得全場讚賞，公開稱功於莉莉',
             ['玲琳','莉莉','清佳','堯明','辰宇'],
             ['玲琳','莉莉','清佳','堯明','辰宇','絹秀','雅媚','歌吹','芳春','雛宮眾人'],'玲琳','main_story'),
            ('第八章',2550,2637,'慧月病情惡化，玲琳請求前往看護，絹秀要求她徹夜拉破魔之弓證明誠意',
             ['玲琳','堯明','絹秀','辰宇','莉莉'],
             ['玲琳','堯明','絹秀','辰宇','莉莉','清佳','雅媚','雛宮眾人'],'玲琳','main_story'),
            ('第九章',2638,2799,'玲琳持續拉破魔之弓，手部受傷仍拒絕停止',
             ['玲琳','莉莉','辰宇','文昴'],['玲琳','莉莉','辰宇','文昴','黃家女官們'],'莉莉','main_story'),
            ('第九章',2800,2820,'玲琳在長時間勞動與拉弓後失去意識',
             ['玲琳','莉莉'],['玲琳','莉莉'],'玲琳','main_story'),
            ('第九章',2821,2909,'堯明等待黃麒宮消息並得知玲琳拉弓與配藥後「黃玲琳」病情改善',
             ['堯明','太監','辰宇'],['堯明','太監','辰宇'],'堯明','main_story'),
            ('第九章',2910,2989,'玲琳醒來後得知「黃玲琳」恢復，冬雪從習慣與知識察覺換身真相',
             ['玲琳','莉莉','冬雪'],['玲琳','莉莉','冬雪'],'玲琳','main_story'),
            ('特別篇 她與化妝',2990,3148,'中元節前夜辰宇與文昴談論感情與人心',
             ['辰宇','文昴'],['辰宇','文昴'],'辰宇','supplemental'),
            ('特別篇 她與化妝',3149,3287,'堯明回想五年前初見玲琳及第一次注意到她對化妝的態度',
             ['堯明','玲琳','絹秀','玲琳父親'],['堯明','玲琳','絹秀','玲琳父親','黃家家人'],'堯明','supplemental'),
            ('特別篇 她與化妝',3288,3462,'冬雪回想被絹秀派去侍奉玲琳以及逐漸理解新主子的經過',
             ['冬雪','絹秀','玲琳'],['冬雪','絹秀','玲琳','黃家女官們'],'冬雪','supplemental'),
            ('特別篇 她與化妝',3463,3490,'中元節當日玲琳完成化妝並與莉莉前往雛宮',
             ['玲琳','莉莉'],['玲琳','莉莉'],'玲琳','supplemental'),
            ('特典ＳＳ',3501,3523,'新人女官琥珀看到藤黃女官們為玲琳各自投入的努力',
             ['琥珀','安安','丹丹','藤黃女官'],['琥珀','安安','丹丹','藤黃女官'],'琥珀','supplemental'),
            ('特典SS',3524,3549,'玲琳在倉庫用有限食材製作點心與莉莉分享',
             ['玲琳','莉莉'],['玲琳','莉莉'],'玲琳','supplemental'),
            ('cmoa特典SS',3550,3681,'幼年玲琳留宿絹秀處，兩人共同閱讀西國童話《真照麗羅》',
             ['玲琳','絹秀'],['玲琳','絹秀'],'玲琳','supplemental'),
          ]

          def base_identity(label: str) -> str:
              label = label.strip()
              label = re.sub(r'（身體：[^）]+）$', '', label)
              return label

          dialogue_re = re.compile(r'^\s*([^:：]{1,50})\s*[:：]\s*[「『]')
          thought_re = re.compile(r'^\s*([^:：]{1,50})\s*[:：]\s*（')
          bare_thought_re = re.compile(r'^\s*（.*）\s*$')

          def compress(nums):
              nums = sorted(set(nums))
              if not nums: return []
              out=[]; s=p=nums[0]
              for n in nums[1:]:
                  if n == p+1:
                      p=n; continue
                  out.append({'start_line':s,'end_line':p})
                  s=p=n
              out.append({'start_line':s,'end_line':p})
              return out

          events=[]
          for idx,d in enumerate(defs,1):
              section,start,end,label,participants,witnesses,focal,scope=d
              if not (1 <= start <= end <= len(lines)):
                  raise SystemExit(f'FATAL: invalid event range {idx}: {start}-{end}')

              per_character={c:[] for c in witnesses}
              # Spoken lines are accessible to all declared witnesses.
              # Explicitly-labelled thoughts are only accessible to their thinker.
              # Bare parenthetical thoughts are assigned only to the event focal thinker.
              for ln in range(start,end+1):
                  text=lines[ln-1]
                  md=dialogue_re.match(text)
                  mt=thought_re.match(text)
                  if mt:
                      thinker=base_identity(mt.group(1))
                      per_character.setdefault(thinker,[]).append(ln)
                  elif md:
                      for c in witnesses:
                          per_character.setdefault(c,[]).append(ln)
                  elif bare_thought_re.match(text) and '插畫' not in text and 'bilibili.com' not in text:
                      if focal:
                          per_character.setdefault(focal,[]).append(ln)

              # Ensure active participants appear in the index even if this conservative
              # first pass has no directly exposable verbal line for them.
              for c in participants:
                  per_character.setdefault(c,[])

              char_access={}
              for c,nums in per_character.items():
                  char_access[c]={
                    'source_ranges': compress(nums),
                    'coverage': 'CONSERVATIVE_VERBAL_AND_OWN_THOUGHT_ONLY',
                    'default_for_unlisted_source_lines': 'DENY'
                  }

              events.append({
                'event_id': f'V01-E-{idx:04d}',
                'narrative_order': idx,
                'section': section,
                'scope': scope,
                'label': label,
                'label_usage': 'NAVIGATION_ONLY_NOT_EVIDENCE',
                'source_ranges': [{'start_line':start,'end_line':end}],
                'participants': participants,
                'observers_or_recipients': [c for c in witnesses if c not in participants],
                'character_access': char_access,
              })

          package={
            'schema_version':'stage2-events-v0.1',
            'artifact_version':'0.1',
            'work':'Though I Am an Inept Villainess Tale of the Butterfly-Rat Body Swap in the Maiden Court',
            'volume':1,
            'source':{
              'path':str(SOURCE),
              'sha256':sha,
              'line_count':len(lines),
              'locator':'1-based inclusive line ranges',
              'speaker_status':'human-confirmed by project owner before Stage 2'
            },
            'policy':{
              'event_is_index_not_replacement_text':True,
              'event_labels_are_navigation_only':True,
              'character_access_default':'DENY',
              'character_access_must_be_source_derived':True,
              'reader_knowledge_is_not_character_knowledge':True,
              'private_thoughts_are_thinker_only':True,
              'inference_is_not_encoded_as_source_access':True,
              'objective_event_is_stored_once':True
            },
            'processing_scope':{
              'main_story_lines':'32-2989',
              'supplemental_story_lines':['2990-3490','3501-3681'],
              'excluded_non_story_lines':['1-31','3491-3500','3682'],
              'excluded_reason':'front/back source metadata, publisher boilerplate, and author afterword are not story Events'
            },
            'limitations':[
              'character_access v0.1 is intentionally conservative: it exposes directly spoken dialogue to declared witnesses, explicit own thoughts, and bare parenthetical thoughts only to the event focal thinker.',
              'Non-verbal observable narration is not yet exhaustively materialized into character_access. This may cause under-exposure but is preferred over leaking narrator-only or another character private information.',
              'Line ranges are stable only while the confirmed Stage 1 source file remains byte-identical; source SHA-256 is therefore mandatory for retrieval.',
              'Participants and observers are story-index metadata and do not imply complete knowledge of the Event.'
            ],
            'events':events
          }

          # Validation invariants.
          ids=[e['event_id'] for e in events]
          assert len(ids)==len(set(ids))
          assert [e['narrative_order'] for e in events]==list(range(1,len(events)+1))
          for e in events:
              es=e['source_ranges'][0]
              for c,a in e['character_access'].items():
                  for r in a['source_ranges']:
                      assert es['start_line'] <= r['start_line'] <= r['end_line'] <= es['end_line']
          # Critical knowledge-boundary regression: Lily/Aya private bargaining must not expose to Reirin.
          for eid in ('V01-E-0012','V01-E-0017'):
              e=next(x for x in events if x['event_id']==eid)
              assert '玲琳' not in e['character_access']
              assert '慧月' not in e['character_access']
          # Keigetsu private perspective event is not exposed to Reirin.
          e=next(x for x in events if x['event_id']=='V01-E-0014')
          assert '玲琳' not in e['character_access']

          TARGET.parent.mkdir(parents=True,exist_ok=True)
          TARGET.write_text(json.dumps(package,ensure_ascii=False,indent=2,sort_keys=False)+'\n',encoding='utf-8')
          print(f'events={len(events)}')
          print(f'target={TARGET}')
          print('validation=PASS')
          PY

      - name: Commit events.json to main
        shell: bash
        run: |
          TARGET='data_processing/text/Though I Am an Inept Villainess Tale of the Butterfly-Rat Body Swap in the Maiden Court/processed/volume_01/events.json'
          cp "$TARGET" /tmp/events.json
          git fetch origin main
          git checkout -B main origin/main
          mkdir -p "$(dirname "$TARGET")"
          cp /tmp/events.json "$TARGET"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$TARGET"
          git commit -m 'Add Volume 1 Stage 2 event index'
          git push origin main
