<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Claude 自动交易 · 控制台</title>
<style>
  :root{
    --bg:#0b0e14; --panel:#141925; --panel2:#1b2130; --line:#252c3b;
    --text:#e6e9ef; --muted:#8a93a6; --green:#2ecc71; --red:#e74c3c;
    --gold:#e6b450; --blue:#3498db;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
       font-family:-apple-system,Segoe UI,Roboto,"PingFang SC","Microsoft YaHei",sans-serif}
  .wrap{max-width:1000px;margin:0 auto;padding:22px 18px 60px}
  h1{font-size:20px;margin:0 0 2px;letter-spacing:.5px}
  .sub{color:var(--muted);font-size:13px;margin-bottom:18px}
  .modecard{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:18px}
  .modehdr{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:6px}
  .modetitle{font-size:18px;font-weight:700}
  .modetitle.swing{color:var(--blue)} .modetitle.day{color:var(--gold)}
  .state-big{font-size:15px;font-weight:700;margin-left:10px}
  .state-big.on{color:var(--green)} .state-big.off{color:var(--muted)}
  .toggle{appearance:none;border:none;cursor:pointer;border-radius:10px;padding:10px 22px;font-size:15px;font-weight:700;transition:.2s;color:#0b0e14}
  .toggle.on{background:linear-gradient(180deg,#46e08a,#1f9d57)}
  .toggle.off{background:linear-gradient(180deg,#3a4252,#262d3b);color:#aeb6c7}
  .toggle:active{transform:scale(.97)}
  .engrow{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);margin:4px 0 12px;flex-wrap:wrap}
  .dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}
  .dot-on{background:var(--green);animation:pulse 1.8s infinite}
  .dot-off{background:var(--red)}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(46,204,113,.6)}70%{box-shadow:0 0 0 8px rgba(46,204,113,0)}100%{box-shadow:0 0 0 0 rgba(46,204,113,0)}}
  .eng-on{color:var(--green);font-weight:700} .eng-off{color:var(--red);font-weight:700}
  .grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:12px}
  .stat{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
  .stat .k{color:var(--muted);font-size:11px} .stat .v{font-size:18px;font-weight:700;margin-top:3px}
  .pos{color:var(--green)} .neg{color:var(--red)}
  table{width:100%;border-collapse:collapse;font-size:12.5px}
  th,td{text-align:right;padding:6px 10px;border-top:1px solid var(--line);white-space:nowrap}
  th:first-child,td:first-child{text-align:left}
  th{color:var(--muted);font-weight:500}
  td.sym{font-weight:700;color:var(--gold)}
  .muted{color:var(--muted)}
  .tbl-h{font-size:12px;color:var(--muted);margin:10px 4px 2px}
  .reason{max-width:300px;white-space:normal;text-align:left;color:#c3cad8}
  .badge{font-size:10px;padding:2px 6px;border-radius:5px;font-weight:700}
  .b-buy{background:#10391f;color:#46e08a}.b-sell{background:#3a1714;color:#ff7a6b}
  .section{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:6px 4px;margin-bottom:16px}
  .section h2{font-size:14px;color:var(--muted);font-weight:600;margin:12px 16px 8px}
  .foot{color:var(--muted);font-size:12px;text-align:center;margin-top:8px}
  .err{color:var(--red);text-align:center;font-size:13px;margin-top:10px;min-height:16px}
</style>
</head>
<body>
<div class="wrap">
  <h1>🤖 Claude 自动交易 · 控制台</h1>
  <div class="sub">模拟盘 paper trading · 本地实例 localhost:8000 · 两个独立账户</div>

  <div id="card-swing" class="modecard"></div>
  <div id="card-day" class="modecard"></div>

  <div class="section">
    <h2>📈 AutoBuyAlert 引擎状态 <span class="muted" style="font-weight:400">· 127.0.0.1:8642</span>
      <a href="/alert" target="_blank" style="float:right;font-size:12px;color:var(--blue);text-decoration:none">在新标签打开 ↗</a>
    </h2>
    <iframe src="/alert" title="auto-buy-alert"
            style="width:100%;height:540px;border:1px solid var(--line);border-radius:10px;background:#0d1117;display:block"></iframe>
  </div>

  <div class="err" id="err"></div>
  <div class="foot" id="foot">自动刷新中…</div>
</div>

<script>
const fmt=(n,d=2)=>(n==null||isNaN(n))?'—':Number(n).toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});
const money=n=>n==null?'—':'$'+fmt(n);
const busy={};

function ago(iso){
  if(!iso) return '—';
  const s=(Date.now()-new Date(iso).getTime())/1000;
  if(s<60) return Math.round(s)+'秒前';
  if(s<3600) return Math.round(s/60)+'分钟前';
  return Math.round(s/3600)+'小时前';
}

async function toggleMode(mode){
  if(busy[mode]) return; busy[mode]=true;
  try{ await fetch('/api/toggle/'+mode,{method:'POST'}); await tick(); }
  catch(e){ document.getElementById('err').textContent='切换失败：'+e; }
  busy[mode]=false;
}

function renderMode(mode, d){
  const on=d.loop_on, online=d.engine_online, a=d.account||{};
  const p=a.total_pnl||0, sign=p>=0?'+':'', pc=p>=0?'pos':'neg';
  let holds='<tr><td class="muted">无持仓（全现金）</td></tr>';
  if(a.positions&&a.positions.length){
    holds=a.positions.map(x=>{
      const xc=(x.pnl||0)>=0?'pos':'neg', xs=(x.pnl||0)>=0?'+':'';
      return `<tr><td class="sym">${x.symbol}</td><td>${x.side||''}</td><td>${fmt(x.quantity,6)}</td>
        <td>${money(x.entry_price)}</td><td>${money(x.current_price)}</td>
        <td class="${xc}">${xs}${money(x.pnl)}</td><td class="${xc}">${xs}${fmt(x.pnl_pct,2)}%</td></tr>`;
    }).join('');
  }
  let trades='<tr><td class="muted">暂无交易</td></tr>';
  if(d.recent_trades&&d.recent_trades.length){
    trades=d.recent_trades.map(t=>{
      const b=(t.action==='buy'||t.action==='cover')?'b-buy':'b-sell';
      return `<tr><td class="muted">${(t.ts_utc||'').slice(5,19).replace('T',' ')}</td>
        <td><span class="badge ${b}">${(t.action||'').toUpperCase()}</span></td>
        <td class="sym">${t.symbol}</td><td>${fmt(t.quantity,4)}</td><td>${money(t.fill_price)}</td>
        <td class="reason">${t.reason||''}</td></tr>`;
    }).join('');
  }
  return `
    <div class="modehdr">
      <div><span class="modetitle ${mode}">${d.label}</span>
        <span class="state-big ${on?'on':'off'}">${on?'运行中':'已停止'}</span></div>
      <button class="toggle ${on?'on':'off'}" onclick="toggleMode('${mode}')">${on?'停止':'启动'}</button>
    </div>
    <div class="engrow">
      <span class="dot ${online?'dot-on':'dot-off'}"></span>
      <span class="${online?'eng-on':'eng-off'}">Claude 引擎：${online?'在线':'离线'}</span>
      <span>· 循环 ${d.cycle_count||0} · 上次 ${ago(d.last_cycle_at)} · 每 ${d.interval_minutes} 分钟一轮</span>
    </div>
    <div class="grid4">
      <div class="stat"><div class="k">总权益</div><div class="v">${money(a.equity)}</div></div>
      <div class="stat"><div class="k">现金</div><div class="v">${money(a.cash)}</div></div>
      <div class="stat"><div class="k">总盈亏</div><div class="v ${pc}">${sign}${money(p)} (${sign}${fmt(a.total_pnl_pct,2)}%)</div></div>
      <div class="stat"><div class="k">持仓</div><div class="v">${a.position_count||0}</div></div>
    </div>
    <div class="tbl-h">持仓 Holdings</div>
    <table><thead><tr><th>标的</th><th>方向</th><th>数量</th><th>成本</th><th>现价</th><th>盈亏</th><th>盈亏%</th></tr></thead><tbody>${holds}</tbody></table>
    <div class="tbl-h">最近交易 Recent Trades</div>
    <table><thead><tr><th>时间(UTC)</th><th>操作</th><th>标的</th><th>数量</th><th>价格</th><th>理由</th></tr></thead><tbody>${trades}</tbody></table>
  `;
}

async function tick(){
  try{
    const d=await (await fetch('/api/status')).json();
    document.getElementById('err').textContent='';
    document.getElementById('card-swing').innerHTML=renderMode('swing', d.modes.swing);
    document.getElementById('card-day').innerHTML=renderMode('day', d.modes.day);
    document.getElementById('foot').textContent='更新于 '+new Date().toLocaleTimeString();
  }catch(e){ document.getElementById('err').textContent='无法连接控制服务：'+e; }
}
tick(); setInterval(tick, 10000);
</script>
</body>
</html>
