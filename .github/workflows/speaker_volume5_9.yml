name: Speaker annotate volumes 5-9

on:
  pull_request:
    branches: [main]
    paths:
      - 'data_processing/text/speaker_stage1_batch_v5_v9.py'
      - '.github/workflows/speaker_volume5_9.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  annotate:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: speaker-volume5-9
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install inference runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install huggingface_hub
          python -m pip install llama-cpp-python --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu
      - name: Annotate and validate
        run: python data_processing/text/speaker_stage1_batch_v5_v9.py
      - name: Commit outputs to work branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'data_processing/text/Though I Am an Inept Villainess Tale of the Butterfly-Rat Body Swap in the Maiden Court/processed/'
          if git diff --cached --quiet; then
            echo 'No generated changes'
            exit 0
          fi
          git commit -m 'Generate Volume 5-9 Stage 1 speaker annotations [skip ci]'
          git push origin HEAD:speaker-volume5-9
