name: Reirin speaker ranker

on:
  push:
    paths:
      - '.github/workflows/reirin-speaker-ranker.yml'
      - 'character_data/tools/train_reirin_speaker_ranker.py'
      - 'character_data/Reirin/sources/raw/novel/惡女不才_第一卷_speaker重校.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rank:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install numpy scikit-learn
      - name: Train, validate, and annotate
        id: run_ranker
        continue-on-error: true
        run: |
          set +e
          python character_data/tools/train_reirin_speaker_ranker.py > character_data/Reirin/speaker_attribution_ranker_run.log 2>&1
          code=$?
          echo "exit_code=$code" >> character_data/Reirin/speaker_attribution_ranker_run.log
          exit $code
      - name: Commit outputs, report, and run log
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- 'character_data/Reirin/sources/raw/novel/惡女不才_第二卷_speaker重校.md' 'character_data/Reirin/sources/raw/novel/惡女不才_第三卷_speaker重校.md' 'character_data/Reirin/speaker_attribution_ranker_validation.md' 'character_data/Reirin/speaker_attribution_ranker_run.log'
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Capture Reirin speaker ranker validation [skip ci]"
          git push
