name: Build Volume 4 Stage 1

on:
  push:
    paths:
      - '.github/workflows/temp_build_volume4_stage1.yml'

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build exact-source speaker version
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from collections import Counter, defaultdict, deque
          import base64, bz2, json, re

          ROOT = Path('data_processing/text/Though I Am an Inept Villainess Tale of the Butterfly-Rat Body Swap in the Maiden Court')
          SOURCE = ROOT / '惡女不才_第四卷_純文字版.md'
          TARGET = ROOT / 'processed/volume_04/惡女不才_第四卷_speaker重校.md'

          DATA = '''[...truncated for tool call transmission in this summary]...'''

          data = json.loads(bz2.decompress(base64.b64decode(DATA)).decode('utf-8'))
          labels = data['labels']
          skips = set(data['skips'])

          raw = SOURCE.read_bytes()
          has_bom = raw.startswith(b'\xef\xbb\xbf')
          text = raw.decode('utf-8-sig')
          source_lines = text.splitlines(keepends=True)
          source_bodies = [x.rstrip('\r\n') for x in source_lines]
          source_counts = Counter(source_bodies)

          label_lists = defaultdict(list)
          for body, label in labels:
              label_lists[body].append(label)
          queues = {k: deque(v) for k, v in label_lists.items()}

          out = []
          applied = 0
          uncertain = 0
          skipped = 0
          for line, body in zip(source_lines, source_bodies):
              ending = line[len(body):]
              label = None
              q = queues.get(body)
              if q and len(q) == source_counts[body]:
                  label = q.popleft()
              elif q and source_counts[body] == 1:
                  label = q[0]
                  q.clear()
              elif q and len(set(q)) == 1:
                  label = q[0]
                  q.popleft()
              elif body in skips:
                  skipped += 1
              elif body.startswith('「'):
                  label = '【speaker 不確定】'
                  uncertain += 1
              elif body.startswith('（') and body.endswith('）') and 'bilibili.com' not in body:
                  label = '【speaker 不確定】'
                  uncertain += 1

              if label:
                  out.append(f'{label}: {body}{ending}')
                  applied += 1
              else:
                  out.append(line)

          result = ''.join(out)

          # Hard invariant: stripping Stage-1 prefixes reconstructs canonical source exactly.
          prefix = re.compile(r'^(?:【speaker 不確定[^】]*】|[^:：\n]{1,100})\s*:\s*(?=[「（])')
          restored = ''.join(prefix.sub('', ln.rstrip('\r\n'), count=1) + ln[len(ln.rstrip(chr(13)+chr(10))):] for ln in result.splitlines(keepends=True))
          if restored != text:
              raise SystemExit('FATAL: attribution-only invariant failed')

          target_bytes = (b'\xef\xbb\xbf' if has_bom else b'') + result.encode('utf-8')
          TARGET.parent.mkdir(parents=True, exist_ok=True)
          TARGET.write_bytes(target_bytes)
          print(f'applied={applied} uncertain={uncertain} intentionally_unlabelled={skipped}')
          print(f'source_bytes={len(raw)} target_bytes={len(target_bytes)}')
          PY

      - name: Commit Stage 1 result and remove temporary workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'data_processing/text/Though I Am an Inept Villainess Tale of the Butterfly-Rat Body Swap in the Maiden Court/processed/volume_04/惡女不才_第四卷_speaker重校.md'
          git rm '.github/workflows/temp_build_volume4_stage1.yml'
          git commit -m 'Add Volume 4 Stage 1 speaker annotations'
          git push
